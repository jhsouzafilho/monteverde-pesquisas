  /* =============================================================== painel */
  function telaPainel() {
    var totalRespostas = db.responses.length;
    var lotes = new Set(db.responses.map(function (r) { return String(r.lote).toUpperCase(); })).size;
    var abertas = db.surveys.filter(function (s) { return s.status === 'open'; }).length;
    var media = db.surveys.length ? Math.round(totalRespostas / db.surveys.length) : 0;

    var cartoes = db.surveys.map(function (p) {
      var rs = respostasDe(p.id);
      var st = STATUS[p.status] || STATUS.draft;
      return '<article class="cartao cartao--interativo">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">' +
        '<div class="cartao__icone">' + MV.icone(p.icon, 30) + '</div>' +
        '<span class="selo ' + st.classe + '">' + st.nome + '</span></div>' +
        '<h3 class="cartao__titulo">' + MV.escapar(p.title) + '</h3>' +
        '<p class="cartao__sub">' + MV.escapar(p.subtitle || '') + '</p>' +
        '<div style="display:flex;gap:20px;margin:14px 0 18px">' +
        '<div><div style="font-size:1.7rem;font-weight:800;color:var(--verde-800);line-height:1">' + rs.length + '</div>' +
        '<div style="font-size:.8rem;color:var(--tinta-clara)">respostas</div></div>' +
        '<div><div style="font-size:1.7rem;font-weight:800;color:var(--verde-800);line-height:1">' + p.questions.length + '</div>' +
        '<div style="font-size:.8rem;color:var(--tinta-clara)">perguntas</div></div>' +
        '<div><div style="font-size:.95rem;font-weight:700;color:var(--verde-800);line-height:1.2;margin-top:6px">' +
        MV.dataCurta(rs.length ? rs[rs.length - 1].createdAt : null) + '</div>' +
        '<div style="font-size:.8rem;color:var(--tinta-clara)">última resposta</div></div></div>' +
        '<div class="cartao__rodape">' +
        '<a class="botao botao--pequeno" href="#/admin/pesquisa/' + p.id + '">' + MV.icone('grafico', 16) + ' Resultados</a>' +
        '<a class="icone-botao" href="#/admin/editar/' + p.id + '" title="Editar">' + MV.icone('lapis', 16) + '</a>' +
        '</div></article>';
    }).join('');

    raiz.innerHTML = molduraAdmin('painel',
      '<div class="admin-cabecalho"><div><h1>Painel de pesquisas</h1>' +
      '<p>Acompanhe os resultados e crie novas enquetes para os condôminos.</p></div>' +
      '<div class="acoes"><a class="botao botao--secundario" href="#/">' + MV.icone('olho', 18) + ' Ver site</a>' +
      '<a class="botao" href="#/admin/nova">' + MV.icone('mais', 18) + ' Nova enquete</a></div></div>' +
      '<div class="grade grade--4">' +
      kpi(totalRespostas, 'Respostas recebidas', MV.plural(db.surveys.length, 'pesquisa cadastrada', 'pesquisas cadastradas')) +
      kpi(abertas, 'Pesquisas abertas', 'visíveis para os moradores agora') +
      kpi(lotes, 'Lotes participantes', 'lotes distintos que responderam') +
      kpi(media, 'Média por pesquisa', 'respostas por pesquisa cadastrada') +
      '</div><div class="painel-secao"><div class="painel-secao__titulo"><h2>Suas pesquisas</h2>' +
      '<span style="color:var(--tinta-clara);font-size:.88rem">' +
      MV.plural(db.surveys.length, 'pesquisa', 'pesquisas') + '</span></div>' +
      (cartoes ? '<div class="grade grade--2">' + cartoes + '</div>'
        : vazio('Nenhuma pesquisa criada ainda', 'Crie a primeira enquete para começar a receber respostas.')) +
      '</div>');
    aoTopo();
  }

  /* =========================================================== resultados */
  function contarOpcoes(respostas, q) {
    var contagem = {};
    q.options.forEach(function (o) { contagem[o] = 0; });
    respostas.forEach(function (r) {
      var v = r.answers ? r.answers[q.id] : null;
      if (v == null) return;
      (Array.isArray(v) ? v : [v]).forEach(function (item) {
        if (contagem[item] != null) contagem[item] += 1;
      });
    });
    return q.options.map(function (o) { return { rotulo: o, valor: contagem[o] }; });
  }
  function respondentes(respostas, q) {
    return respostas.filter(function (r) {
      var v = r.answers ? r.answers[q.id] : null;
      return v != null && v !== '' && (!Array.isArray(v) || v.length > 0);
    }).length;
  }
  function todasCriancas(respostas, q) {
    var lista = [];
    respostas.forEach(function (r) {
      var v = r.answers ? r.answers[q.id] : null;
      if (Array.isArray(v)) v.forEach(function (c) { lista.push(c); });
    });
    return lista;
  }
  function barras(itens, total) {
    if (!itens.length) return '<div class="vazio">Sem dados ainda.</div>';
    var maior = itens.reduce(function (m, i) { return Math.max(m, i.valor); }, 0) || 1;
    var lider = itens.slice().sort(function (a, b) { return b.valor - a.valor; })[0];
    return '<div class="barras">' + itens.map(function (item) {
      var pct = total ? Math.round((item.valor / total) * 100) : 0;
      var largura = item.valor > 0 ? Math.max((item.valor / maior) * 100, 5) : 0;
      return '<div class="barra' + (item === lider && item.valor > 0 ? ' barra--destaque' : '') + '">' +
        '<div class="barra__topo"><span class="barra__rotulo">' + MV.escapar(item.rotulo) + '</span>' +
        '<span class="barra__valor">' + item.valor + ' · ' + pct + '%</span></div>' +
        '<div class="barra__trilho"><div class="barra__preenchimento" data-largura="' + largura + '%"></div></div></div>';
    }).join('') + '</div>';
  }
  function tipoNome(tipo) {
    var achou = TIPOS.find(function (t) { return t.valor === tipo; });
    return achou ? achou.nome : tipo;
  }

  function graficoDaPergunta(q, respostas) {
    var total = respondentes(respostas, q);
    var cabecalhoGrafico = '<h3 class="grafico__titulo">' + MV.escapar(q.label) + '</h3>' +
      '<p class="grafico__sub">' + tipoNome(q.type) + ' · ' + MV.plural(total, 'resposta', 'respostas') + '</p>';

    if (q.type === 'single') {
      var dados = contarOpcoes(respostas, q).filter(function (i) { return i.valor > 0; });
      return '<div class="grafico">' + cabecalhoGrafico + MV.graficoRosca(dados, { centro: 'respostas' }) + '</div>';
    }
    if (q.type === 'multi') {
      var ordenado = contarOpcoes(respostas, q).sort(function (a, b) { return b.valor - a.valor; });
      return '<div class="grafico">' + cabecalhoGrafico + barras(ordenado, total) + '</div>';
    }
    if (q.type === 'scale') {
      var notas = [1, 2, 3, 4, 5].map(function (n) {
        return { rotulo: 'Nota ' + n, valor: respostas.filter(function (r) { return Number(r.answers && r.answers[q.id]) === n; }).length };
      });
      var soma = notas.reduce(function (s, i, idx) { return s + i.valor * (idx + 1); }, 0);
      return '<div class="grafico">' + cabecalhoGrafico +
        '<p style="margin:-8px 0 14px;font-weight:700;color:var(--verde-700)">Média: ' +
        (total ? (soma / total).toFixed(1).replace('.', ',') : '0') + ' de 5</p>' + barras(notas, total) + '</div>';
    }
    if (q.type === 'number') {
      var valores = respostas.map(function (r) { return Number(r.answers && r.answers[q.id]); })
        .filter(function (n) { return Number.isFinite(n); });
      if (!valores.length) return '<div class="grafico">' + cabecalhoGrafico + '<div class="vazio">Sem dados ainda.</div></div>';
      var mapa = {};
      valores.forEach(function (v) { mapa[v] = (mapa[v] || 0) + 1; });
      var itens = Object.keys(mapa).map(Number).sort(function (a, b) { return a - b; }).map(function (v) {
        return { rotulo: v + (v === 1 ? ' pessoa' : ' pessoas'), valor: mapa[v] };
      });
      var somaN = valores.reduce(function (s, v) { return s + v; }, 0);
      return '<div class="grafico">' + cabecalhoGrafico +
        '<p style="margin:-8px 0 14px;font-weight:700;color:var(--verde-700)">Total: ' + somaN + ' · média de ' +
        (somaN / valores.length).toFixed(1).replace('.', ',') + ' por lote</p>' + barras(itens, valores.length) + '</div>';
    }
    if (q.type === 'criancas') {
      var criancas = todasCriancas(respostas, q);
      if (!criancas.length) return '<div class="grafico">' + cabecalhoGrafico + '<div class="vazio">Sem dados ainda.</div></div>';
      var faixas = [
        { rotulo: '0 a 3 anos', teste: function (i) { return i <= 3; } },
        { rotulo: '4 a 6 anos', teste: function (i) { return i >= 4 && i <= 6; } },
        { rotulo: '7 a 9 anos', teste: function (i) { return i >= 7 && i <= 9; } },
        { rotulo: '10 a 12 anos', teste: function (i) { return i >= 10 && i <= 12; } },
        { rotulo: '13 anos ou mais', teste: function (i) { return i >= 13; } }
      ].map(function (f) {
        return { rotulo: f.rotulo, valor: criancas.filter(function (c) { return f.teste(c.idade); }).length };
      }).filter(function (f) { return f.valor > 0; });
      var porIdade = {};
      criancas.forEach(function (c) { porIdade[c.idade] = (porIdade[c.idade] || 0) + 1; });
      var selos = Object.keys(porIdade).map(Number).sort(function (a, b) { return a - b; }).map(function (idade) {
        return '<span class="selo" style="font-size:.78rem">' + idade + ' anos · ' + porIdade[idade] + '</span>';
      }).join(' ');
      return '<div class="grafico grafico--largo">' + cabecalhoGrafico +
        '<p style="margin:-8px 0 14px;font-weight:700;color:var(--verde-700)">' +
        MV.plural(criancas.length, 'criança cadastrada', 'crianças cadastradas') + '</p>' +
        '<div class="grade grade--2" style="align-items:start"><div>' + barras(faixas, criancas.length) + '</div>' +
        '<div><p class="grafico__sub" style="margin-bottom:10px">Distribuição por idade</p>' +
        '<div style="display:flex;flex-wrap:wrap;gap:7px">' + selos + '</div></div></div></div>';
    }
    var textos = respostas.filter(function (r) { return r.answers && r.answers[q.id]; });
    if (!textos.length) return '<div class="grafico">' + cabecalhoGrafico + '<div class="vazio">Nenhum comentário enviado.</div></div>';
    return '<div class="grafico grafico--largo">' + cabecalhoGrafico +
      '<div style="display:grid;gap:10px;max-height:340px;overflow:auto">' +
      textos.slice().reverse().map(function (r) {
        return '<div style="background:var(--areia-100);border-radius:12px;padding:13px 15px;border:1px solid var(--areia-300)">' +
          '<div style="font-size:.82rem;color:var(--tinta-clara);margin-bottom:4px">' +
          MV.escapar(r.nome) + ' · ' + MV.escapar(r.lote) + '</div>' +
          '<div style="font-size:.94rem">' + MV.escapar(r.answers[q.id]) + '</div></div>';
      }).join('') + '</div></div>';
  }

  function destaques(p, respostas) {
    var escolhas = p.questions.filter(function (q) { return q.type === 'single' || q.type === 'multi'; });
    if (!escolhas.length) return '';
    var itens = escolhas.slice(0, 4).map(function (q) {
      var dados = contarOpcoes(respostas, q).slice().sort(function (a, b) { return b.valor - a.valor; });
      var total = respondentes(respostas, q);
      var pct = total ? Math.round((dados[0].valor / total) * 100) : 0;
      return '<div style="flex:1 1 190px">' +
        '<div style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--verde-200);font-weight:700">' +
        MV.escapar(resumoRotulo(q.label)) + '</div>' +
        '<div style="font-size:1.18rem;font-weight:800;color:#fff;margin-top:4px">' + MV.escapar(dados[0].rotulo) + '</div>' +
        '<div style="font-size:.84rem;color:var(--verde-200)">' + dados[0].valor + ' respostas · ' + pct + '%</div></div>';
    }).join('');
    return '<div class="painel-secao"><div style="background:var(--verde-800);border-radius:var(--raio-md);' +
      'padding:22px;display:flex;gap:26px;flex-wrap:wrap;box-shadow:var(--sombra-sm)">' +
      '<div style="flex:1 1 100%;display:flex;align-items:center;gap:10px;color:#fff;font-weight:700">' +
      MV.icone('check', 20) + ' Preferências mais votadas</div>' + itens + '</div></div>';
  }

  function telaResultados(id) {
    var p = porId(id);
    if (!p) { location.hash = '#/admin'; return; }
    var respostas = respostasDe(id);
    var st = STATUS[p.status] || STATUS.draft;

    var conteudoGraficos;
    if (!respostas.length) {
      conteudoGraficos = vazio('Ainda sem respostas', 'Compartilhe o link da pesquisa com os moradores para começar a receber respostas.');
    } else {
      var lotes = new Set(respostas.map(function (r) { return String(r.lote).toUpperCase(); })).size;
      var recentes = respostas.filter(function (r) {
        return (Date.now() - new Date(r.createdAt).getTime()) < 7 * 24 * 3600 * 1000;
      }).length;
      var kpis = [kpi(respostas.length, 'Respostas', 'total recebido'), kpi(lotes, 'Lotes', 'lotes distintos'),
        kpi(recentes, 'Últimos 7 dias', 'respostas recentes')];
      var qNumero = p.questions.find(function (q) { return q.type === 'number'; });
      if (qNumero) {
        var soma = respostas.reduce(function (s, r) { return s + (Number(r.answers && r.answers[qNumero.id]) || 0); }, 0);
        kpis.push(kpi(soma, 'Participantes', 'soma informada pelos lotes'));
      }
      var qCriancas = p.questions.find(function (q) { return q.type === 'criancas'; });
      if (qCriancas) {
        var criancas = todasCriancas(respostas, qCriancas);
        var mediaIdade = criancas.length
          ? (criancas.reduce(function (s, c) { return s + c.idade; }, 0) / criancas.length).toFixed(1).replace('.', ',') : '0';
        kpis.push(kpi(criancas.length, 'Crianças inscritas', 'idade média de ' + mediaIdade + ' anos'));
      }
      conteudoGraficos = '<div class="grade grade--4">' + kpis.join('') + '</div>' + destaques(p, respostas) +
        '<div class="painel-secao"><div class="grade grade--2">' +
        p.questions.map(function (q) { return graficoDaPergunta(q, respostas); }).join('') + '</div></div>';
    }

    raiz.innerHTML = molduraAdmin('painel',
      '<a class="botao botao--secundario botao--pequeno" href="#/admin" style="margin-bottom:16px">' +
      MV.icone('voltar', 16) + ' Painel</a>' +
      '<div class="admin-cabecalho"><div>' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">' +
      '<span class="selo ' + st.classe + '">' + st.nome + '</span>' +
      '<span style="color:var(--tinta-clara);font-size:.86rem">/pesquisa/' + MV.escapar(p.slug) + '</span></div>' +
      '<h1>' + MV.escapar(p.title) + '</h1><p>' + MV.escapar(p.subtitle || '') + '</p></div>' +
      '<div class="acoes"><button class="botao botao--secundario" id="btn-csv">' + MV.icone('baixar', 18) +
      ' Exportar CSV</button><a class="botao" href="#/admin/editar/' + p.id + '">' + MV.icone('lapis', 18) +
      ' Editar</a></div></div>' +
      '<div class="abas"><button class="aba ativa" data-aba="graficos">Resultados</button>' +
      '<button class="aba" data-aba="cruzamento">Cruzamento</button>' +
      '<button class="aba" data-aba="respostas">Respostas (' + respostas.length + ')</button></div>' +
      '<div id="aba-graficos">' + conteudoGraficos + '</div>' +
      '<div id="aba-cruzamento" class="oculto">' + montarCruzamento(p, respostas) + '</div>' +
      '<div id="aba-respostas" class="oculto">' + montarTabela(respostas) + '</div>');

    animarBarras();
    raiz.querySelectorAll('.aba').forEach(function (botao) {
      botao.addEventListener('click', function () {
        raiz.querySelectorAll('.aba').forEach(function (b) { b.classList.remove('ativa'); });
        botao.classList.add('ativa');
        ['graficos', 'cruzamento', 'respostas'].forEach(function (nome) {
          document.getElementById('aba-' + nome).classList.toggle('oculto', nome !== botao.dataset.aba);
        });
        animarBarras();
      });
    });
    document.getElementById('btn-csv').addEventListener('click', function () {
      MV.toast('Na versão instalada, este botão baixa a planilha CSV com todas as respostas.');
    });
    ligarCruzamento(p, respostas);
    ligarTabela(p, respostas);
    aoTopo();
  }

  function montarCruzamento(p, respostas) {
    var opcoes = p.questions.filter(function (q) { return q.type === 'single' || q.type === 'multi'; });
    if (opcoes.length < 2 || !respostas.length) {
      return vazio('Cruzamento indisponível', 'É preciso ter ao menos duas perguntas de escolha e algumas respostas para cruzar os dados.');
    }
    var seletor = function (id, selecionado) {
      return '<select class="selecao" id="' + id + '">' + opcoes.map(function (q, i) {
        return '<option value="' + MV.escapar(q.id) + '"' + (i === selecionado ? ' selected' : '') + '>' +
          MV.escapar(resumoRotulo(q.label)) + '</option>';
      }).join('') + '</select>';
    };
    return '<div class="grafico"><h3 class="grafico__titulo">Cruzamento de preferências</h3>' +
      '<p class="grafico__sub">Descubra, por exemplo, qual horário é mais votado em cada dia da semana.</p>' +
      '<div class="linha" style="margin-bottom:18px">' +
      '<div><label class="rotulo" for="cruz-linha">Nas linhas</label>' + seletor('cruz-linha', 0) + '</div>' +
      '<div><label class="rotulo" for="cruz-coluna">Nas colunas</label>' + seletor('cruz-coluna', 1) + '</div>' +
      '</div><div id="cruz-resultado"></div></div>';
  }

  function ligarCruzamento(p, respostas) {
    var selLinha = document.getElementById('cruz-linha');
    var selColuna = document.getElementById('cruz-coluna');
    if (!selLinha || !selColuna) return;
    function desenhar() {
      var qA = p.questions.find(function (q) { return q.id === selLinha.value; });
      var qB = p.questions.find(function (q) { return q.id === selColuna.value; });
      var matriz = qA.options.map(function (a) {
        return qB.options.map(function (b) {
          return respostas.filter(function (r) {
            var va = r.answers ? r.answers[qA.id] : null;
            var vb = r.answers ? r.answers[qB.id] : null;
            var temA = Array.isArray(va) ? va.indexOf(a) > -1 : va === a;
            var temB = Array.isArray(vb) ? vb.indexOf(b) > -1 : vb === b;
            return temA && temB;
          }).length;
        });
      });
      var maior = { valor: 0, linha: '', coluna: '' };
      matriz.forEach(function (linha, i) {
        linha.forEach(function (v, j) {
          if (v > maior.valor) maior = { valor: v, linha: qA.options[i], coluna: qB.options[j] };
        });
      });
      document.getElementById('cruz-resultado').innerHTML =
        (maior.valor ? '<div class="aviso aviso--sucesso">' + MV.icone('check', 20) +
          '<div>Combinação mais votada: <strong>' + MV.escapar(maior.linha) + '</strong> com <strong>' +
          MV.escapar(maior.coluna) + '</strong> — ' + MV.plural(maior.valor, 'morador', 'moradores') + '.</div></div>' : '') +
        MV.mapaDeCalor(qA.options, qB.options, matriz, { canto: '' });
    }
    selLinha.addEventListener('change', desenhar);
    selColuna.addEventListener('change', desenhar);
    desenhar();
  }

  function montarTabela(respostas) {
    if (!respostas.length) return vazio('Nenhuma resposta ainda', 'As respostas aparecerão aqui assim que chegarem.');
    return '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center">' +
      '<input class="entrada" id="busca-respostas" placeholder="Buscar por nome, telefone ou lote..." style="max-width:340px">' +
      '<span id="contador-respostas" style="color:var(--tinta-clara);font-size:.88rem"></span></div>' +
      '<div class="tabela-caixa"><table class="tabela"><thead><tr>' +
      '<th>Recebida em</th><th>Morador</th><th>Quadra/Lote</th><th>Resumo</th><th></th>' +
      '</tr></thead><tbody id="corpo-respostas"></tbody></table></div>';
  }

  function ligarTabela(p, respostas) {
    var corpo = document.getElementById('corpo-respostas');
    if (!corpo) return;
    var busca = document.getElementById('busca-respostas');
    var contador = document.getElementById('contador-respostas');

    function resumo(r) {
      return p.questions.slice(0, 3).map(function (q) {
        var v = r.answers ? r.answers[q.id] : null;
        if (v == null || v === '') return '';
        var texto;
        if (q.type === 'criancas') texto = v.map(function (c) { return c.idade + ' anos'; }).join(', ');
        else if (Array.isArray(v)) texto = v.join(', ');
        else texto = String(v);
        return '<div class="tabela__detalhe"><strong>' + MV.escapar(resumoRotulo(q.label)) + ':</strong> ' +
          MV.escapar(texto.length > 70 ? texto.slice(0, 68) + '...' : texto) + '</div>';
      }).join('');
    }

    function desenhar() {
      var termo = (busca.value || '').toLowerCase().trim();
      var lista = respostas.slice().reverse().filter(function (r) {
        if (!termo) return true;
        return (r.nome + ' ' + MV.formatarTelefone(r.telefone) + ' ' + r.lote).toLowerCase().indexOf(termo) > -1;
      });
      contador.textContent = MV.plural(lista.length, 'resposta exibida', 'respostas exibidas');
      corpo.innerHTML = lista.map(function (r) {
        return '<tr><td style="white-space:nowrap">' + MV.dataHora(r.createdAt) + '</td>' +
          '<td><strong>' + MV.escapar(r.nome) + '</strong><div class="tabela__detalhe">' +
          MV.escapar(MV.formatarTelefone(r.telefone)) + '</div></td>' +
          '<td>' + MV.escapar(r.lote) + '</td><td>' + resumo(r) + '</td>' +
          '<td class="acoes-linha"><button class="icone-botao" data-ver="' + r.id + '" title="Ver resposta completa">' +
          MV.icone('olho', 16) + '</button></td></tr>';
      }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--tinta-clara);padding:24px">Nenhuma resposta encontrada.</td></tr>';
    }

    busca.addEventListener('input', desenhar);
    corpo.addEventListener('click', function (e) {
      var ver = e.target.closest('[data-ver]');
      if (!ver) return;
      var alvo = respostas.find(function (r) { return r.id === ver.dataset.ver; });
      if (alvo) mostrarDetalhe(p, alvo);
    });
    desenhar();
  }

  function mostrarDetalhe(p, r) {
    var linhas = p.questions.map(function (q) {
      var v = r.answers ? r.answers[q.id] : null;
      var texto;
      if (v == null || v === '') texto = '<em style="color:var(--tinta-clara)">não respondida</em>';
      else if (q.type === 'criancas') {
        texto = v.map(function (c) { return MV.escapar(c.nome || 'Criança') + ' — ' + c.idade + ' anos'; }).join('<br>');
      } else if (Array.isArray(v)) texto = MV.escapar(v.join(', '));
      else texto = MV.escapar(String(v));
      return '<div style="margin-bottom:14px"><div style="font-size:.8rem;text-transform:uppercase;' +
        'letter-spacing:.05em;color:var(--tinta-clara);font-weight:700">' + MV.escapar(q.label) + '</div>' +
        '<div style="font-size:.97rem">' + texto + '</div></div>';
    }).join('');
    var modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = '<div class="modal__caixa" role="dialog" aria-modal="true" style="max-width:560px;max-height:85vh;overflow:auto">' +
      '<h3 style="margin-bottom:2px">' + MV.escapar(r.nome) + '</h3>' +
      '<p style="color:var(--tinta-media);margin-bottom:18px">' + MV.escapar(MV.formatarTelefone(r.telefone)) +
      ' · Lote ' + MV.escapar(r.lote) + ' · ' + MV.dataHora(r.createdAt) + '</p>' + linhas +
      '<div class="modal__acoes"><button class="botao botao--secundario" data-fechar>Fechar</button></div></div>';
    modal.addEventListener('click', function (e) {
      if (e.target === modal || e.target.hasAttribute('data-fechar')) modal.remove();
    });
    document.body.appendChild(modal);
  }

  /* =========================================================== construtor */
  function telaConstrutor(id) {
    if (id) {
      var existente = porId(id);
      if (!existente) { location.hash = '#/admin'; return; }
      rascunho = JSON.parse(JSON.stringify(existente));
    } else if (!rascunho || rascunho.__novo !== true) {
      rascunho = {
        id: null, __novo: true, title: '', subtitle: '', description: '', icon: 'leaf', status: 'draft',
        questions: [JSON.parse(JSON.stringify(MODELOS[2].pergunta))]
      };
      rascunho.questions[0].id = 'q_1';
    }
    desenharConstrutor();
  }

  function desenharConstrutor() {
    var r = rascunho;
    var novo = !r.id;
    raiz.innerHTML = molduraAdmin(novo ? 'nova' : 'painel',
      '<a class="botao botao--secundario botao--pequeno" href="#/admin" style="margin-bottom:16px">' +
      MV.icone('voltar', 16) + ' Painel</a>' +
      '<div class="admin-cabecalho"><div><h1>' + (novo ? 'Nova enquete' : 'Editar enquete') + '</h1>' +
      '<p>Monte as perguntas, escolha o ícone e publique para os moradores.</p></div></div>' +
      '<div class="construtor"><div>' +
      '<div class="bloco"><div class="bloco__cabecalho"><span class="bloco__numero">1</span>' +
      '<h2 class="bloco__titulo">Identificação da enquete</h2></div>' +
      '<div class="campo"><label class="rotulo" for="e-titulo">Título<span class="obrigatorio">*</span></label>' +
      '<input class="entrada" id="e-titulo" data-modelo="title" value="' + MV.escapar(r.title) +
      '" placeholder="Ex.: Aulas de Pilates"></div>' +
      '<div class="campo"><label class="rotulo" for="e-sub">Subtítulo</label>' +
      '<input class="entrada" id="e-sub" data-modelo="subtitle" value="' + MV.escapar(r.subtitle) +
      '" placeholder="Ex.: Pesquisa de interesse dos moradores"></div>' +
      '<div class="campo"><label class="rotulo" for="e-desc">Texto de apresentação</label>' +
      '<textarea class="area" id="e-desc" data-modelo="description" placeholder="Explique o objetivo da pesquisa...">' +
      MV.escapar(r.description) + '</textarea></div>' +
      '<div class="campo"><span class="rotulo">Ícone</span><div class="seletor-icones">' +
      ICONES_PESQUISA.map(function (nome) {
        return '<button type="button" data-icone-escolha="' + nome + '"' + (r.icon === nome ? ' class="ativo"' : '') +
          '>' + MV.icone(nome, 24) + '</button>';
      }).join('') + '</div></div></div>' +
      '<div class="painel-secao__titulo" style="margin-top:26px"><h2>Perguntas ' +
      '<span style="color:var(--tinta-clara);font-weight:600;font-size:.9rem">(' + r.questions.length + ')</span></h2></div>' +
      '<div id="lista-perguntas">' + r.questions.map(editorPergunta).join('') + '</div>' +
      '<div class="bloco" style="border-style:dashed;background:transparent">' +
      '<p style="font-weight:700;margin-bottom:12px">Adicionar pergunta</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="botao botao--secundario botao--pequeno" data-nova-pergunta>' + MV.icone('mais', 16) +
      ' Pergunta em branco</button>' +
      MODELOS.map(function (m, i) {
        return '<button class="botao botao--secundario botao--pequeno" data-modelo-pergunta="' + i + '">' +
          MV.icone('mais', 16) + ' ' + MV.escapar(m.nome) + '</button>';
      }).join('') + '</div></div></div>' +
      '<aside class="construtor__lateral"><div class="bloco"><h3 style="margin-top:0">Publicação</h3>' +
      '<div class="campo"><label class="rotulo" for="e-status">Situação</label>' +
      '<select class="selecao" id="e-status" data-modelo="status">' +
      '<option value="draft"' + (r.status === 'draft' ? ' selected' : '') + '>Rascunho (não aparece no site)</option>' +
      '<option value="open"' + (r.status === 'open' ? ' selected' : '') + '>Aberta (recebendo respostas)</option>' +
      '<option value="closed"' + (r.status === 'closed' ? ' selected' : '') + '>Encerrada (não recebe mais)</option>' +
      '</select></div>' +
      (r.id ? '<p style="font-size:.85rem;color:var(--tinta-media)">Link público:<br><code style="font-size:.82rem">/pesquisa/' +
        MV.escapar(r.slug) + '</code></p>' : '') +
      '<button class="botao botao--bloco" id="btn-salvar">' + MV.icone('check', 18) + ' Salvar enquete</button>' +
      (r.id ? '<button class="botao botao--perigo botao--bloco" id="btn-excluir" style="margin-top:10px">' +
        MV.icone('lixeira', 18) + ' Excluir enquete</button>' : '') + '</div>' +
      '<div class="bloco"><h3 style="margin-top:0">Dicas</h3>' +
      '<ul style="margin:0;padding-left:18px;color:var(--tinta-media);font-size:.9rem;line-height:1.7">' +
      '<li>Nome, telefone e lote já são pedidos automaticamente em toda pesquisa.</li>' +
      '<li>Use <strong>Múltipla escolha</strong> para dias e horários — o painel cruza os dois.</li>' +
      '<li>O bloco <strong>Crianças</strong> gera o gráfico de idades automaticamente.</li>' +
      '<li>Deixe como <strong>Rascunho</strong> enquanto estiver montando.</li></ul></div></aside></div>');

    MV.sincronizarSelecoes(raiz);
    ligarConstrutor();
    aoTopo();
  }

  function editorPergunta(q, indice) {
    var comOpcoes = q.type === 'single' || q.type === 'multi';
    return '<div class="pergunta-editor" data-pergunta="' + indice + '">' +
      '<div class="pergunta-editor__topo"><span class="pergunta-editor__ordem">' + (indice + 1) + '</span>' +
      '<select class="selecao" data-campo-pergunta="type" style="max-width:230px">' +
      TIPOS.map(function (t) {
        return '<option value="' + t.valor + '"' + (q.type === t.valor ? ' selected' : '') + '>' + t.nome + '</option>';
      }).join('') + '</select>' +
      '<div class="pergunta-editor__acoes">' +
      '<button class="icone-botao" data-mover="-1" title="Subir">' + MV.icone('cima', 16) + '</button>' +
      '<button class="icone-botao" data-mover="1" title="Descer">' + MV.icone('baixo', 16) + '</button>' +
      '<button class="icone-botao icone-botao--perigo" data-remover-pergunta title="Remover">' +
      MV.icone('lixeira', 16) + '</button></div></div>' +
      '<div class="campo"><label class="rotulo">Enunciado</label>' +
      '<input class="entrada" data-campo-pergunta="label" value="' + MV.escapar(q.label) + '" placeholder="Escreva a pergunta"></div>' +
      '<div class="campo"><label class="rotulo">Texto de ajuda</label>' +
      '<input class="entrada" data-campo-pergunta="help" value="' + MV.escapar(q.help || '') + '" placeholder="Opcional"></div>' +
      (comOpcoes ? '<div class="campo"><label class="rotulo">Opções</label><div class="opcoes-editor">' +
        (q.options || []).map(function (opcao, i) {
          return '<div class="opcao-editor"><input class="entrada" data-opcao="' + i + '" value="' + MV.escapar(opcao) + '">' +
            '<button class="icone-botao icone-botao--perigo" data-remover-opcao="' + i + '" title="Remover opção">' +
            MV.icone('x', 16) + '</button></div>';
        }).join('') + '</div><button class="botao botao--secundario botao--pequeno" data-nova-opcao style="margin-top:10px">' +
        MV.icone('mais', 16) + ' Adicionar opção</button></div>' : '') +
      (q.type === 'number' ? '<div class="linha"><div class="campo"><label class="rotulo">Valor mínimo</label>' +
        '<input class="entrada" type="number" data-campo-pergunta="min" value="' + (q.min != null ? q.min : 0) + '"></div>' +
        '<div class="campo"><label class="rotulo">Valor máximo</label>' +
        '<input class="entrada" type="number" data-campo-pergunta="max" value="' + (q.max != null ? q.max : 20) + '"></div></div>' : '') +
      (q.type === 'scale' ? '<div class="linha"><div class="campo"><label class="rotulo">Legenda da nota 1</label>' +
        '<input class="entrada" data-campo-pergunta="minLabel" value="' + MV.escapar(q.minLabel || 'Pouco') + '"></div>' +
        '<div class="campo"><label class="rotulo">Legenda da nota 5</label>' +
        '<input class="entrada" data-campo-pergunta="maxLabel" value="' + MV.escapar(q.maxLabel || 'Muito') + '"></div></div>' : '') +
      '<label class="interruptor"><input type="checkbox" data-campo-pergunta="required"' + (q.required ? ' checked' : '') +
      '><span class="interruptor__trilho"></span><span>Resposta obrigatória</span></label></div>';
  }

  function ligarConstrutor() {
    var r = rascunho;

    raiz.querySelectorAll('[data-modelo]').forEach(function (el) {
      el.addEventListener('input', function () { r[el.dataset.modelo] = el.value; });
      el.addEventListener('change', function () { r[el.dataset.modelo] = el.value; });
    });
    raiz.querySelectorAll('[data-icone-escolha]').forEach(function (botao) {
      botao.addEventListener('click', function () {
        r.icon = botao.dataset.iconeEscolha;
        raiz.querySelectorAll('[data-icone-escolha]').forEach(function (b) { b.classList.remove('ativo'); });
        botao.classList.add('ativo');
      });
    });

    var lista = document.getElementById('lista-perguntas');
    lista.addEventListener('input', function (e) {
      var editor = e.target.closest('[data-pergunta]');
      if (!editor) return;
      var q = r.questions[Number(editor.dataset.pergunta)];
      var campo = e.target.dataset.campoPergunta;
      if (campo) {
        if (campo === 'required') q.required = e.target.checked;
        else if (campo === 'min' || campo === 'max') q[campo] = Number(e.target.value);
        else q[campo] = e.target.value;
      }
      if (e.target.dataset.opcao != null) q.options[Number(e.target.dataset.opcao)] = e.target.value;
    });
    lista.addEventListener('change', function (e) {
      var editor = e.target.closest('[data-pergunta]');
      if (!editor) return;
      var q = r.questions[Number(editor.dataset.pergunta)];
      if (e.target.dataset.campoPergunta === 'type') {
        q.type = e.target.value;
        if ((q.type === 'single' || q.type === 'multi') && (!q.options || !q.options.length)) q.options = ['Opção 1', 'Opção 2'];
        if (q.type === 'number') { q.min = q.min != null ? q.min : 0; q.max = q.max != null ? q.max : 20; }
        desenharConstrutor();
      }
      if (e.target.dataset.campoPergunta === 'required') q.required = e.target.checked;
    });
    lista.addEventListener('click', function (e) {
      var editor = e.target.closest('[data-pergunta]');
      if (!editor) return;
      var indice = Number(editor.dataset.pergunta);
      var q = r.questions[indice];
      var mover = e.target.closest('[data-mover]');
      if (mover) {
        var destino = indice + Number(mover.dataset.mover);
        if (destino < 0 || destino >= r.questions.length) return;
        r.questions.splice(destino, 0, r.questions.splice(indice, 1)[0]);
        return desenharConstrutor();
      }
      if (e.target.closest('[data-remover-pergunta]')) {
        if (r.questions.length === 1) return MV.toast('A enquete precisa de ao menos uma pergunta.', 'erro');
        r.questions.splice(indice, 1);
        return desenharConstrutor();
      }
      if (e.target.closest('[data-nova-opcao]')) {
        q.options.push('Nova opção');
        return desenharConstrutor();
      }
      var removerOpcao = e.target.closest('[data-remover-opcao]');
      if (removerOpcao) {
        if (q.options.length <= 2) return MV.toast('Mantenha ao menos duas opções.', 'erro');
        q.options.splice(Number(removerOpcao.dataset.removerOpcao), 1);
        return desenharConstrutor();
      }
    });

    raiz.querySelector('[data-nova-pergunta]').addEventListener('click', function () {
      r.questions.push({
        id: uid('q'), type: 'single', label: '', help: '', required: true, options: ['Opção 1', 'Opção 2']
      });
      desenharConstrutor();
      rolarParaUltima();
    });
    raiz.querySelectorAll('[data-modelo-pergunta]').forEach(function (botao) {
      botao.addEventListener('click', function () {
        var modelo = JSON.parse(JSON.stringify(MODELOS[Number(botao.dataset.modeloPergunta)].pergunta));
        modelo.id = uid('q');
        r.questions.push(modelo);
        desenharConstrutor();
        rolarParaUltima();
      });
    });

    document.getElementById('btn-salvar').addEventListener('click', salvarEnquete);
    var excluir = document.getElementById('btn-excluir');
    if (excluir) excluir.addEventListener('click', excluirEnquete);
  }

  function rolarParaUltima() {
    var editores = raiz.querySelectorAll('[data-pergunta]');
    var ultimo = editores[editores.length - 1];
    if (ultimo) ultimo.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function apelido(texto) {
    return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'pesquisa';
  }

  function salvarEnquete() {
    var r = rascunho;
    if (!r.title || r.title.trim().length < 3) {
      MV.toast('Informe um título para a enquete.', 'erro');
      document.getElementById('e-titulo').focus();
      return;
    }
    if (r.questions.some(function (q) { return !q.label || !q.label.trim(); })) {
      return MV.toast('Todas as perguntas precisam de um enunciado.', 'erro');
    }
    if (r.id) {
      var atual = porId(r.id);
      atual.title = r.title;
      atual.subtitle = r.subtitle;
      atual.description = r.description;
      atual.icon = r.icon;
      atual.status = r.status;
      atual.questions = r.questions;
      atual.updatedAt = new Date().toISOString();
    } else {
      var slug = apelido(r.title);
      if (porSlug(slug)) slug = slug + '-' + Math.random().toString(36).slice(2, 5);
      var nova = {
        id: uid('svy'), slug: slug, title: r.title, subtitle: r.subtitle, description: r.description,
        icon: r.icon, status: r.status, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
        questions: r.questions
      };
      db.surveys.push(nova);
      r.id = nova.id;
    }
    rascunho = null;
    guardar();
    MV.toast('Enquete salva com sucesso.');
    location.hash = '#/admin/pesquisa/' + r.id;
  }

  function excluirEnquete() {
    MV.confirmar({
      titulo: 'Excluir enquete',
      texto: 'Todas as respostas desta enquete serão apagadas. Esta ação não pode ser desfeita.',
      confirmar: 'Excluir tudo', perigo: true
    }).then(function (ok) {
      if (!ok) return;
      db.surveys = db.surveys.filter(function (s) { return s.id !== rascunho.id; });
      db.responses = db.responses.filter(function (r) { return r.surveyId !== rascunho.id; });
      rascunho = null;
      guardar();
      MV.toast('Enquete excluída.');
      location.hash = '#/admin';
      rotear();
    });
  }

  /* ========================================================= configurações */
  function telaConfig() {
    raiz.innerHTML = molduraAdmin('config',
      '<div class="admin-cabecalho"><div><h1>Configurações</h1>' +
      '<p>Segurança do painel e informações do portal.</p></div></div>' +
      '<div class="grade grade--2" style="align-items:start">' +
      '<div class="bloco"><div class="bloco__cabecalho">' +
      '<span style="color:var(--verde-700);display:inline-flex">' + MV.icone('cadeado', 22) + '</span>' +
      '<h2 class="bloco__titulo">Senha de acesso</h2></div>' +
      '<div class="aviso">' + MV.icone('info', 20) +
      '<div>Na versão instalada no condomínio, a administração troca a senha por aqui. ' +
      'Nesta demonstração a senha é fixa (<strong>' + SENHA_DEMO + '</strong>).</div></div>' +
      '<div class="campo"><label class="rotulo">Senha atual</label>' +
      '<input class="entrada" type="password" value="demonstracao" disabled></div>' +
      '<div class="campo"><label class="rotulo">Nova senha</label>' +
      '<input class="entrada" type="password" placeholder="Mínimo de 8 caracteres" disabled></div>' +
      '<button class="botao" disabled>Salvar nova senha</button></div>' +
      '<div class="bloco"><div class="bloco__cabecalho">' +
      '<span style="color:var(--verde-700);display:inline-flex">' + MV.icone('info', 22) + '</span>' +
      '<h2 class="bloco__titulo">Como funciona</h2></div>' +
      '<ul style="margin:0;padding-left:18px;color:var(--tinta-media);line-height:1.8;font-size:.94rem">' +
      '<li>Toda pesquisa pede nome, telefone e quadra/lote do morador.</li>' +
      '<li>Os resultados viram gráficos automaticamente, incluindo o cruzamento de dias e horários.</li>' +
      '<li>Na versão instalada, as respostas ficam no servidor do condomínio e podem ser exportadas em CSV.</li>' +
      '<li>Nesta demonstração tudo fica apenas no seu navegador.</li></ul></div></div>');
    aoTopo();
  }

  /* ================================================================ start */
  document.getElementById('recomecar').addEventListener('click', reiniciar);
  document.addEventListener('click', function (e) {
    var sair = e.target.closest('#btn-sair');
    if (sair) {
      e.preventDefault();
      sessao = false;
      location.hash = '#/';
      rotear();
    }
  });
  window.addEventListener('hashchange', rotear);

  db = carregar();
  rotear();
})();

</script>

</body>
</html>
